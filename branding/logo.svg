<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Secret Santa Bot</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F6F4A"/>
      <stop offset="1" stop-color="#0E3D29"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E63946"/>
      <stop offset="1" stop-color="#B5172A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- snow -->
  <g fill="#FFFFFF" opacity=".35">
    <circle cx="70" cy="90" r="6"/><circle cx="455" cy="70" r="5"/><circle cx="60" cy="420" r="5"/>
    <circle cx="450" cy="430" r="7"/><circle cx="95" cy="250" r="4"/><circle cx="430" cy="300" r="4"/>
  </g>
  <!-- ears / bolts -->
  <rect x="92" y="290" width="34" height="84" rx="14" fill="#CFC6B4"/>
  <rect x="386" y="290" width="34" height="84" rx="14" fill="#CFC6B4"/>
  <!-- head -->
  <rect x="118" y="214" width="276" height="228" rx="64" fill="#F7F3EA"/>
  <!-- secret mask -->
  <path d="M128 286 C170 262 220 268 256 286 C292 268 342 262 384 286 L384 330 C350 352 300 350 256 326 C212 350 162 352 128 330 Z" fill="#1D1B2E"/>
  <ellipse cx="196" cy="306" rx="26" ry="18" fill="#FFD166"/>
  <ellipse cx="316" cy="306" rx="26" ry="18" fill="#FFD166"/>
  <circle cx="204" cy="303" r="7" fill="#1D1B2E"/>
  <circle cx="324" cy="303" r="7" fill="#1D1B2E"/>
  <!-- smile -->
  <path d="M212 382 Q256 414 300 382" fill="none" stroke="#1D1B2E" stroke-width="12" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="168" cy="380" r="14" fill="#F4A3A8" opacity=".7"/>
  <circle cx="344" cy="380" r="14" fill="#F4A3A8" opacity=".7"/>
  <!-- santa hat -->
  <path d="M142 214 C150 120 230 66 318 76 C384 84 420 126 424 186 L372 214 Z" fill="url(#hat)"/>
  <circle cx="426" cy="188" r="30" fill="#FFFFFF"/>
  <rect x="104" y="192" width="304" height="54" rx="27" fill="#FFFFFF"/>
  <!-- gift tag hint on brim -->
  <g transform="translate(232 112) rotate(-8)">
    <rect x="0" y="0" width="48" height="44" rx="6" fill="#FFD166"/>
    <rect x="20" y="0" width="8" height="44" fill="#1F6F4A"/>
    <rect x="0" y="16" width="48" height="8" fill="#1F6F4A"/>
  </g>
</svg>
